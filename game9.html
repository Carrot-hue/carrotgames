<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>躲猫猫小游戏</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"Microsoft YaHei",sans-serif}
body{background:#111;color:#fff;padding:16px;display:flex;flex-direction:column;align-items:center}
#gameCanvas{background:#222;border:2px solid #888}
#info{margin-bottom:10px;font-size:18px;text-align:center;line-height:1.5}
#tip{margin-top:10px;color:#aaa;text-align:center;line-height:1.6;max-width:700px}
</style>
</head>
<body>
<div id="info"></div>
<canvas id="gameCanvas"></canvas>
<div id="tip">
【入】WASD移动 Z拆墙(仅1次)｜【鬼】方向键移动 L拆墙(仅1次)<br>
O开启抓捕｜ESC退出<br>
躲藏模式：仅入能动；抓捕模式：仅鬼能动；抓捕时入伪装成墙；60秒倒计时，抓到鬼加分，时间到入加分
</div>

<script>
const GAME_W = 31;
const GAME_H = 16;
const BLOCK_SIZE = 20;
const CATCH_SEC = 60;
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
canvas.width = GAME_W * BLOCK_SIZE;
canvas.height = GAME_H * BLOCK_SIZE;

let ground = Array.from({length:GAME_W},()=>Array(GAME_H).fill(0));

let p1x, p1y;   //玩家1：入 WASD
let p2x, p2y;   //玩家2：鬼 方向键
let catX, catY; //猫AI
let dogX, dogY; //狗AI
let box = [[0,0],[0,0],[0,0],[0,0]];

let score1 = 0; //入分数
let score2 = 0; //鬼分数
let p1CanBreak = true;
let p2CanBreak = true;
let catchMode = false;
let isCaught = false;
let timeStart = Date.now();
let aiTimer = Date.now();

function findBox(x,y){
    for(let i=0;i<4;i++){
        if(box[i][0]===x && box[i][1]===y) return i;
    }
    return -1;
}
function IsEntity(x,y){
    if(x===p1x && y===p1y) return true;
    if(x===p2x && y===p2y) return true;
    if(x===catX && y===catY) return true;
    if(x===dogX && y===dogY) return true;
    return false;
}
function IsPlayerRu(x,y){ return x===p1x && y===p1y; }
function IsGhost(x,y){ return x===p2x && y===p2y; }

function pushEntity(tx,ty,pushX,pushY){
    if(tx===p1x && ty===p1y){ p1x=pushX; p1y=pushY; }
    else if(tx===p2x && ty===p2y){ p2x=pushX; p2y=pushY; }
    else if(tx===catX && ty===catY){ catX=pushX; catY=pushY; }
    else if(tx===dogX && ty===dogY){ dogX=pushX; dogY=pushY; }
}

function movePlayer(px, py, nx, ny, isGhost){
    if(isCaught) return;
    if(ground[nx][ny]===1) return;
    const dx = nx - px[0];
    const dy = ny - py[0];

    const boxIdx = findBox(nx,ny);
    if(boxIdx !== -1){
        const bx = box[boxIdx][0]+dx;
        const by = box[boxIdx][1]+dy;
        if(ground[bx][by]===1 || findBox(bx,by)!==-1 || IsEntity(bx,by)) return;
        box[boxIdx][0]=bx;
        box[boxIdx][1]=by;
        px[0]=nx; py[0]=ny;
        return;
    }

    if(IsEntity(nx,ny)){
        if(isGhost && catchMode && IsPlayerRu(nx,ny)){
            px[0]=nx; py[0]=ny;
            return;
        }
        const pushX = nx+dx;
        const pushY = ny+dy;
        if(ground[pushX][pushY]===1 || findBox(pushX,pushY)!==-1 || IsEntity(pushX,pushY)) return;
        pushEntity(nx,ny,pushX,pushY);
        px[0]=nx; py[0]=ny;
        return;
    }
    px[0]=nx; py[0]=ny;
}

function getRandomSafePos(){
    while(true){
        const x = Math.floor(Math.random()*28)+2;
        const y = Math.floor(Math.random()*13)+2;
        if(ground[x][y]===0 && findBox(x,y)===-1 && !IsEntity(x,y)){
            return [x,y];
        }
    }
}

function initMap(){
    catchMode = false;
    isCaught = false;
    p1CanBreak = true;
    p2CanBreak = true;
    for(let y=1;y<=15;y++){
        for(let x=1;x<=30;x++){
            if(y===1 || y===15 || x===1 || x===30) ground[x][y]=1;
            else ground[x][y]=0;
        }
    }
    p1x = 5; p1y = 3;
    p2x = 22; p2y = 11;
    box[0]=[12,5];
    box[1]=[18,5];
    box[2]=[12,10];
    box[3]=[18,10];

    for(let y=2;y<=14;y++){
        for(let x=2;x<=29;x++){
            if( (Math.abs(x-p1x)<=1 && Math.abs(y-p1y)<=1) || (Math.abs(x-p2x)<=1 && Math.abs(y-p2y)<=1) ) continue;
            let nearBox=false;
            for(let i=0;i<4;i++){
                if(Math.abs(x-box[i][0])<=1 && Math.abs(y-box[i][1])<=1){ nearBox=true;break; }
            }
            if(nearBox) continue;
            if(Math.random()<0.32) ground[x][y]=1;
        }
    }
    [catX,catY] = getRandomSafePos();
    [dogX,dogY] = getRandomSafePos();
    timeStart = Date.now();
    aiTimer = Date.now();
}

function draw(){
    ctx.fillStyle="#111";
    ctx.fillRect(0,0,canvas.width,canvas.height);
    for(let y=1;y<=15;y++){
        for(let x=1;x<=30;x++){
            if(x===p2x && y===p2y){
                ctx.fillStyle="#ff4444";
                ctx.fillRect(x*BLOCK_SIZE+1,y*BLOCK_SIZE+1,BLOCK_SIZE-2,BLOCK_SIZE-2);
            }else if(x===catX && y===catY){
                ctx.fillStyle="#dd66dd";
                ctx.fillRect(x*BLOCK_SIZE+1,y*BLOCK_SIZE+1,BLOCK_SIZE-2,BLOCK_SIZE-2);
            }else if(x===dogX && y===dogY){
                ctx.fillStyle="#dd66dd";
                ctx.fillRect(x*BLOCK_SIZE+1,y*BLOCK_SIZE+1,BLOCK_SIZE-2,BLOCK_SIZE-2);
            }else if(x===p1x && y===p1y){
                if(!catchMode || isCaught){
                    ctx.fillStyle="#44aaff";
                }else{
                    ctx.fillStyle="#777777";
                }
                ctx.fillRect(x*BLOCK_SIZE+1,y*BLOCK_SIZE+1,BLOCK_SIZE-2,BLOCK_SIZE-2);
            }else{
                let bIdx = findBox(x,y);
                if(bIdx!==-1){
                    ctx.fillStyle="#ffdd44";
                    ctx.fillRect(x*BLOCK_SIZE+1,y*BLOCK_SIZE+1,BLOCK_SIZE-2,BLOCK_SIZE-2);
                }else if(ground[x][y]===1){
                    ctx.fillStyle="#777777";
                    ctx.fillRect(x*BLOCK_SIZE+1,y*BLOCK_SIZE+1,BLOCK_SIZE-2,BLOCK_SIZE-2);
                }
            }
        }
    }

    let infoText = `【入】分数:${score1} 【鬼】分数:${score2}`;
    if(catchMode && !isCaught){
        const passed = Math.floor((Date.now()-timeStart)/1000);
        const remain = Math.max(0, CATCH_SEC - passed);
        infoText += ` 抓捕剩余时间：${remain}秒`;
    }
    let modeText = "";
    if(isCaught){
        modeText = "===== 本局结束，2秒后重置 =====";
    }else if(!catchMode){
        modeText = "===== 躲藏模式 (只有入能动，按 O 开启抓捕) =====";
    }else{
        modeText = "===== 抓捕模式 (只有鬼能动，入伪装成墙) =====";
    }
    document.getElementById("info").innerText = infoText + "\n" + modeText;
}

function aiMove(ax,ay){
    if(isCaught) return;
    const dir = Math.floor(Math.random()*4);
    let nx=ax[0], ny=ay[0];
    if(dir===0) ny--;
    else if(dir===1) ny++;
    else if(dir===2) nx--;
    else if(dir===3) nx++;
    movePlayer(ax,ay,nx,ny,false);
}

document.addEventListener("keydown",e=>{
    if(isCaught) return;
    const dx4 = [0,0,1,-1];
    const dy4 = [1,-1,0,0];

    if(e.code==="KeyZ"){
        if(p1CanBreak){
            for(let i=0;i<4;i++){
                const tx = p1x + dx4[i];
                const ty = p1y + dy4[i];
                if(ground[tx][ty]===1){
                    ground[tx][ty]=0;
                    p1CanBreak=false;
                    break;
                }
            }
        }
        e.preventDefault();
    }
    if(e.code==="KeyL"){
        if(p2CanBreak){
            for(let i=0;i<4;i++){
                const tx = p2x + dx4[i];
                const ty = p2y + dy4[i];
                if(ground[tx][ty]===1){
                    ground[tx][ty]=0;
                    p2CanBreak=false;
                    break;
                }
            }
        }
        e.preventDefault();
    }
    if(e.code==="KeyO"){
        if(!catchMode){
            catchMode = true;
            timeStart = Date.now();
        }
        e.preventDefault();
    }

    //玩家1 入，躲藏模式才能移动
    if(!catchMode){
        const p1px = [p1x];
        const p1py = [p1y];
        if(e.code==="KeyW") movePlayer(p1px,p1py,p1x,p1y-1,false);
        if(e.code==="KeyS") movePlayer(p1px,p1py,p1x,p1y+1,false);
        if(e.code==="KeyA") movePlayer(p1px,p1py,p1x-1,p1y,false);
        if(e.code==="KeyD") movePlayer(p1px,p1py,p1x+1,p1y,false);
        p1x=p1px[0]; p1y=p1py[0];
    }

    //玩家2 鬼，抓捕模式才能移动
    if(catchMode){
        const p2px = [p2x];
        const p2py = [p2y];
        if(e.code==="ArrowUp") movePlayer(p2px,p2py,p2x,p2y-1,true);
        if(e.code==="ArrowDown") movePlayer(p2px,p2py,p2x,p2y+1,true);
        if(e.code==="ArrowLeft") movePlayer(p2px,p2py,p2x-1,p2y,true);
        if(e.code==="ArrowRight") movePlayer(p2px,p2py,p2x+1,p2y,true);
        p2x=p2px[0]; p2y=p2py[0];
    }

    if(e.code==="Escape"){
        alert("感谢游玩！刷新页面重新开局");
    }
});

function loop(){
    const now = Date.now();
    //猫狗AI移动
    if(now - aiTimer >= 350){
        const catP = [catX,catY];
        const dogP = [dogX,dogY];
        aiMove(catP,catP);
        catX = catP[0]; catY=catP[1];
        aiMove(dogP,dogP);
        dogX = dogP[0]; dogY=dogP[1];
        aiTimer = now;
    }

    //抓捕判定
    if(catchMode && !isCaught && p1x===p2x && p1y===p2y){
        score2++;
        isCaught = true;
    }
    //60秒倒计时结束
    if(catchMode && !isCaught){
        const passed = Math.floor((now-timeStart)/1000);
        if(passed >= CATCH_SEC){
            score1 +=1;
            isCaught = true;
        }
    }

    //2秒后重置地图
    if(isCaught){
        setTimeout(()=>{
            initMap();
        },2000);
    }

    draw();
}

initMap();
setInterval(loop,60);
</script>
</body>
</html>
