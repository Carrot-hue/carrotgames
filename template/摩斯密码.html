<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>摩尔斯电码 加密破译</title>
<style>
*{box-sizing:border-box;font-family:system-ui,sans-serif;margin:0;padding:0}
body{background:#1a1a1a;color:#fff;padding:24px;max-width:700px;margin:0 auto}
h2{margin-bottom:16px;color:#8cf}
#modeBox{margin-bottom:12px}
input,textarea,button{font-size:16px;padding:8px;margin:4px}
textarea{width:100%;height:120px;background:#222;color:#fff;border:1px solid #555;resize:none}
#result{margin-top:12px;padding:10px;background:#252525;min-height:40px;white-space:pre-wrap}
</style>
</head>
<body>
<h2>摩尔斯电码 加密 / 破译</h2>
<div id="modeBox">
<label><input type="radio" name="mode" value="0" checked> 0 - 破译(摩尔斯→字母)</label>
<label><input type="radio" name="mode" value="1"> 1 - 加密(字母→摩尔斯)</label>
</div>
<textarea id="inputBox" placeholder="破译：输入摩尔斯码，空格分隔，输入 / 结束；
加密：直接输入英文文本，大小写均可"></textarea>
<br>
<button onclick="run()">执行转换</button>
<div>输出结果：</div>
<div id="result"></div>

<script>
const moths = [
    ".-","-...","-.-.","-..",".","..-.","--.","....","..",".---",
    "-.-",".-..","--","-.","---",".--.","--.-",".-.","...","-",
    "..-","...-",".--","-..-","-.--","--.."
];

function run(){
    const mode = document.querySelector('input[name="mode"]:checked').value;
    const text = document.getElementById("inputBox").value;
    let res = "";
    if(mode === "0"){
        // 破译：摩尔斯转大写字母，遇到 / 停止
        const parts = text.split(/\s+/);
        for(let part of parts){
            if(part === "/") break;
            let ok = false;
            for(let j=0;j<26;j++){
                if(part === moths[j]){
                    res += String.fromCharCode(j+65)+" ";
                    ok = true;
                }
            }
            if(!ok) res += part+" ";
        }
    }else{
        //加密：字母转摩尔斯，忽略空格，其他符号原样输出
        for(let ch of text){
            let c = ch.charCodeAt(0);
            if(c >= 65 && c <=90){ //大写A-Z
                res += moths[c-65]+"   ";
            }else if(c >=97 && c <=122){ //小写a-z
                res += moths[c-97]+"   ";
            }else if(ch === " "){
                continue;
            }else{
                res += ch+" ";
            }
        }
    }
    document.getElementById("result").innerText = res;
}
</script>
</body>
</html>
