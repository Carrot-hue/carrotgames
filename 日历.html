<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>万年历</title>
<style>
*{box-sizing:border-box;font-family:Microsoft YaHei,sans-serif;margin:0;padding:0}
body{background:#111;color:#fff;padding:20px;text-align:center}
#wrap{display:inline-block}
#calendar{font-size:20px;white-space:pre;font-family:Consolas,monospace;line-height:1.6}
.info{margin-top:16px;font-size:18px;text-align:left}
.tip{margin-top:12px;color:#aaa;font-size:14px}
.hl-today{background:#f44;color:#fff}
.hl-select{background:#08f;color:#fff}
</style>
</head>
<body>
<div id="wrap">
<pre id="calendar"></pre>
<div class="info" id="infoBox"></div>
<div class="tip">A/D切换月份 W/S切换年份｜空格回到今日｜方向键移动选择｜ESC清空</div>
</div>

<script>
// 农历基础数据
const lunarInfo = [
    0x04bd8,0x04ae0,0x0a570,0x054d5,0x0d260,0x0d950,0x16554,0x056a0,0x09ad0,0x055d2,
    0x04ae0,0x0a5b6,0x0a4d0,0x0d250,0x1d255,0x0b540,0x0d6a0,0x0ada2,0x095b0,0x14977,
    0x04970,0x0a4b0,0x0b4b5,0x06a50,0x06d40,0x1ab54,0x02b60,0x09570,0x052f2,0x04970
];
const sfTable = [
    {y:2025,m:1,d:29},
    {y:2026,m:2,d:17},
    {y:2027,m:2,d:6},
    {y:2028,m:1,d:26},
    {y:2029,m:2,d:13}
];
const gan = ["甲","乙","丙","丁","戊","己","庚","辛","壬","癸"];
const zhi = ["子","丑","寅","卯","辰","巳","午","未","申","酉","戌","亥"];
const lunarMonthName = ["","正月","二月","三月","四月","五月","六月","七月","八月","九月","十月","冬月","腊月"];

let iy, im, id; //选中日期
let ty, tm, td; //今日

function getMonthFirstWeek(y,m){
    let mm=m, yy=y;
    if(mm<3){ mm+=12; yy-=1; }
    let c = Math.floor(yy/100);
    let yy2 = yy%100;
    let w = (yy2 + Math.floor(yy2/4) + Math.floor(c/4) - 2*c + Math.floor(26*(mm+1)/10) -1) %7;
    if(w<0) w+=7;
    return w;
}
function getLeapMonth(year){
    return lunarInfo[year-1900] & 0xf;
}
function getLunarMonthDays(year,month){
    return (lunarInfo[year-1900] & (0x10000 >> month)) ?30:29;
}
function isLeapYear(y){
    return (y%4===0 && y%100!==0) || y%400===0;
}
function solarToLunar(y,m,d){
    const solarMonthDay = [31,28,31,30,31,30,31,31,30,31,30,31];
    if(isLeapYear(y)) solarMonthDay[1]=29;
    let totalDays=0;
    for(let i=1900;i<y;i++) totalDays += isLeapYear(i)?366:365;
    for(let i=1;i<m;i++) totalDays += solarMonthDay[i-1];
    totalDays += d-1;

    let ly=1900;
    while(totalDays>0){
        let yearDays=348;
        for(let i=1;i<=12;i++) yearDays += getLunarMonthDays(ly,i);
        let leap = getLeapMonth(ly);
        if(leap>0) yearDays += getLunarMonthDays(ly,leap);
        if(totalDays>yearDays){ totalDays -= yearDays; ly++; }
        else break;
    }
    let leap = getLeapMonth(ly);
    let lm=1;
    let isleap=false;
    while(totalDays>0){
        let md = getLunarMonthDays(ly,lm);
        if(totalDays <= md) break;
        totalDays -= md;
        if(leap!==0 && lm===leap && !isleap){
            isleap=true;
            md = getLunarMonthDays(ly,lm);
            if(totalDays <= md) break;
            totalDays -= md;
        }
        lm++;
        isleap=false;
    }
    let ld = totalDays;
    return {ly,lm,ld,isleap};
}
function fixLunarYearSafe(gy,gm,gd,rawLy){
    for(let s of sfTable){
        if(gy===s.y){
            let cur = gy*10000 + gm*100 + gd;
            let sfd = s.y*10000 + s.m*100 + s.d;
            return cur < sfd ? rawLy-1 : rawLy;
        }
    }
    return rawLy;
}
function dateToDay(y,m,d){
    if(m<=2){ y--; m+=12; }
    return 365*y + Math.floor(y/4) - Math.floor(y/100) + Math.floor(y/400) + Math.floor(306*(m+1)/10) -428 +d;
}
function getDayDiff(y1,m1,d1,y2,m2,d2){
    return dateToDay(y1,m1,d1) - dateToDay(y2,m2,d2);
}

function renderCalendar(y,m){
    const dn = [31,28,31,30,31,30,31,31,30,31,30,31];
    if(isLeapYear(y)) dn[1]=29;
    let week_start = getMonthFirstWeek(y,m);
    let lines = [];
    lines.push(`           ${y}年${m}月`);
    lines.push(`  日  一  二  三  四  五  六`);
    let row = "";
    for(let j=0;j<week_start;j++) row += "    ";
    let month_day = (m===2) ? (isLeapYear(y)?29:28) : dn[m-1];

    for(let i=1;i<=month_day;i++){
        let cls = "";
        if(i===td && m===tm && y===ty) cls = "hl-today";
        if(i===id && m===im && y===iy) cls = "hl-select";
        let s = i.toString().padStart(4," ");
        if(cls) s = `<span class="${cls}">${s}</span>`;
        row += s;
        if((week_start+i)%7===0){
            lines.push(row);
            row="";
        }
    }
    if(row) lines.push(row);
    document.getElementById("calendar").innerHTML = lines.join("\n");

    let diff = getDayDiff(iy,im,id, ty,tm,td);
    let lunar = solarToLunar(iy,im,id);
    let lyReal = fixLunarYearSafe(iy,im,id, lunar.ly);
    let gIdx = (lyReal -4) %10;
    let zIdx = (lyReal -4) %12;
    let lunarStr = `${gan[gIdx]}${zhi[zIdx]}年`;
    if(lunar.isleap) lunarStr += ` 闰${lunarMonthName[lunar.lm]}`;
    else lunarStr += ` ${lunarMonthName[lunar.lm]}`;
    lunarStr += `${lunar.ld}日`;

    let diffStr;
    if(diff>0) diffStr = `${diff} 天之后`;
    else if(diff<0) diffStr = `${-diff} 天之前`;
    else diffStr = "就是今天";

    document.getElementById("infoBox").innerHTML = `
选中日期：${iy}-${im}-${id}<br>
农历：${lunarStr}<br>
距离今天：${diffStr}
`;
}

//初始化今日
{
    const now = new Date();
    ty = now.getFullYear();
    tm = now.getMonth()+1;
    td = now.getDate();
    iy = ty; im = tm; id = td;
    renderCalendar(iy,im);
}

//键盘监听
document.addEventListener("keydown",e=>{
    e.preventDefault();
    const key = e.key.toLowerCase();
    const dn = [31,28,31,30,31,30,31,31,30,31,30,31];
    function getMaxDate(y,m){
        if(m===2) return isLeapYear(y)?29:28;
        return dn[m-1];
    }
    if(key === "escape"){
        iy=ty; im=tm; id=td;
    }else if(key === " "){
        iy=ty; im=tm; id=td;
    }else if(key === "a"){
        im--;
        if(im<1){ im=12; iy--; }
        id=1;
    }else if(key === "d"){
        im++;
        if(im>12){ im=1; iy++; }
        id=1;
    }else if(key === "w"){
        iy--; id=1;
    }else if(key === "s"){
        iy++; id=1;
    }else if(e.key === "ArrowLeft"){
        id--;
        if(id<1){
            im--;
            if(im<1){ im=12; iy--; }
            id = getMaxDate(iy,im);
        }
    }else if(e.key === "ArrowRight"){
        id++;
        let maxd = getMaxDate(iy,im);
        if(id>maxd){
            im++;
            if(im>12){ im=1; iy++; }
            id=1;
        }
    }else if(e.key === "ArrowUp"){
        id -=7;
        if(id<1){
            im--;
            if(im<1){ im=12; iy--; }
            id = getMaxDate(iy,im)+id;
        }
    }else if(e.key === "ArrowDown"){
        id +=7;
        let maxd = getMaxDate(iy,im);
        if(id>maxd){
            id -= maxd;
            im++;
            if(im>12){ im=1; iy++; }
        }
    }
    renderCalendar(iy,im);
})
</script>
</body>
</html>
